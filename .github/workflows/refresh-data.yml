name: Refresh wiki data

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "wiki-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data.json images
          git diff --cached --quiet || (git commit -m "Refresh wiki data" && git push)
