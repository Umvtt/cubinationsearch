<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubination Index – search cubes, armor, weapons, recipes & the map</title>
<meta name="description" content="Fan-made search for the Roblox game Cubination. Look up every cube, armor, weapon, enemy and recipe, find what you can craft, and explore the interactive world map.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l12 6v14l-12 6L4 23V9z' fill='%23e8590c'/%3E%3Cpath d='M16 3l12 6-12 6L4 9z' fill='%23ffa94d'/%3E%3Cpath d='M16 15v14L4 23V9z' fill='%23b8400a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="#/" aria-label="Cubination Index home">
    <svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
      <path d="M16 3l12 6v14l-12 6L4 23V9z" fill="#e8590c"/>
      <path d="M16 3l12 6-12 6L4 9z" fill="#ffa94d"/>
      <path d="M16 15v14L4 23V9z" fill="#b8400a"/>
    </svg>
    <span>Cubination<b>Index</b></span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" id="tab-search" class="on">Search</a>
    <a href="#/craft" id="tab-craft">Craft</a>
    <a href="#/map" id="tab-map">Map</a>
  </nav>
</header>

<main>
  <section id="searchbar">
    <div class="hero-cubes" aria-hidden="true">
      <svg class="hc hc1" viewBox="0 0 32 32"><path d="M16 3l12 6v14l-12 6L4 23V9z" fill="#e03131"/><path d="M16 3l12 6-12 6L4 9z" fill="#ff8787"/><path d="M16 15v14L4 23V9z" fill="#a61e1e"/></svg>
      <svg class="hc hc2" viewBox="0 0 32 32"><path d="M16 3l12 6v14l-12 6L4 23V9z" fill="#1c7ed6"/><path d="M16 3l12 6-12 6L4 9z" fill="#74c0fc"/><path d="M16 15v14L4 23V9z" fill="#1864ab"/></svg>
      <svg class="hc hc3" viewBox="0 0 32 32"><path d="M16 3l12 6v14l-12 6L4 23V9z" fill="#f2b705"/><path d="M16 3l12 6-12 6L4 9z" fill="#ffe066"/><path d="M16 15v14L4 23V9z" fill="#c79100"/></svg>
    </div>
    <label for="q" class="lbl">What are you looking for?</label>
    <div class="box">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="steel armor, regen coil, raider, iron cube…">
      <kbd title="Press / to search">/</kbd>
    </div>
    <div id="quick" class="quick"></div>
    <div id="cats" class="cats" role="tablist" aria-label="Filter by category"></div>
  </section>

  <section id="list" aria-live="polite"></section>
  <section id="craft" hidden></section>
  <section id="mapview" hidden></section>
  <article id="page" hidden></article>
</main>

<footer>
  <p>All info comes from the <a id="wikilink" href="https://cubination.fandom.com" target="_blank" rel="noopener">Cubination Wiki</a>
  (text under <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA</a>).
  Fan-made, not affiliated with the game. Spotted something wrong? Fix it on the wiki and it shows up here after the next refresh.
  <span id="built"></span></p>
</footer>

<!-- crafting table: drop any item here to see how it is made -->
<button id="dock" class="dock" aria-label="Crafting table: drag an item here to see how it is made">
  <span class="dk-ico"></span><span class="dk-txt"><b>Crafting table</b><small>Drag any item here</small></span>
</button>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
<div id="fx" aria-hidden="true"></div>

<script src="app.js"></script>
<script src="map.js"></script>
</body>
</html>
